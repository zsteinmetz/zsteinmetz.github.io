name: Deploy PRISM to GitHub Pages

on:
  # Push triggers are disabled by default for template users.
  # Uncomment the lines below to enable automatic deployment on push.
  push:
   branches: 
       - main
       - ci
  # Refresh citation metrics weekly (Mondays 06:00 UTC). npm run build triggers
  # the "prebuild" script, which fetches fresh data from OpenAlex and falls back
  # to the committed data/openalex-metrics.json when the fetch fails.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4