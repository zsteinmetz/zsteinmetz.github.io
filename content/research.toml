# ------------------------------------------------------------------
# Research profile
# ------------------------------------------------------------------
[profile]
narrative = """With a background in environmental chemistry, ecotoxicology, and soil science, I study pollutants from source to sink: how they enter agricultural systems, how they move and transform between land and water, and what that means for ecosystem functions. Because such questions can only be answered with trustworthy data, method development, quality assurance, and reproducible data workflows are integral parts of my research rather than add-ons."""

interests = [
  "Microplastics and synthetic polymers",
  "Environmental analytical chemistry",
  "Soil and agroecosystems",
  "Reproducible data workflows"
]

# ------------------------------------------------------------------
# Research themes
# ------------------------------------------------------------------
[highlights]
columns = 3

[[highlights.items]]
title = "Anthropogenic pollutants in soils and agroecosystems"
content = "Sources, pathways, transformation, and fate of pollutants in agricultural soils and related environmental systems."

[[highlights.items]]
title = "Plastic pollution and polymer characterization"
content = "Methods to identify and quantify synthetic polymers in heterogeneous environmental matrices, with a focus on plastic residues in soils."

[[highlights.items]]
title = "Environmental analytical chemistry"
content = "Instrumental analysis, method development, validation, quality assurance, and interpretation of complex environmental samples."

[[highlights.items]]
title = "Data-driven environmental science"
content = "Statistical analysis, automation, and reproducible computational workflows for processing and communicating environmental data."

[[highlights.items]]
title = "Ecotoxicological and ecosystem perspectives"
content = "Linking chemical measurements with exposure, transformation, ecological effects, and ecosystem functions."

# ------------------------------------------------------------------
# Projects
# ------------------------------------------------------------------
[[projects]]
title = "Microplastics in Agricultural Soils"
featured = true
period = "2016 – present"
question = "Agricultural soils receive plastic residues from multiple sources — but how much plastic accumulates, and where does it come from?"
background = "Occurrence and fate of plastic debris in soil are difficult to assess because soils are heterogeneous and analytical methods are technically demanding. Within the interdisciplinary PLAST project at University of Koblenz-Landau, we studied plastic film covers in strawberry and vegetable cultivation from ecological, agronomic, and social-science perspectives."
role = "Method development, analytical evaluation, project coordination, supervision, and scientific communication."
methods = ["Pyrolysis-GC/MS", "FTIR spectroscopy", "Field sampling", "Soil science", "Statistics"]
contributions = [
  "Developed and validated a solvent-based pyrolysis-GC/MS method for the selective quantification of polyethylene, polypropylene, and polystyrene in soil.",
  "Screening studies of agricultural fields revealing elevated polyethylene levels associated with thin and perforated plastic films.",
  "Extension of the method to further matrices, including freshwater, sediments, and sewage sludge-amended soil, in collaborations with LUT University (Finland) and the Swedish University of Agricultural Sciences."
]
outcomes = "The method is now used in routine analyses and national-scale assessments; the findings can help guide farmers and decision makers toward more durable materials and reduced plastic emissions."
collaborators = [
  "University of Koblenz-Landau / RPTU Kaiserslautern-Landau",
  "LUT University, Finland",
  "Swedish University of Agricultural Sciences (SLU)",
  "Brno University of Technology, Czech Republic",
  "ETH Zurich, Switzerland"
]
funding = "State of Rhineland-Palatinate (PLAST)"
publications = [
  "Steinmetz et al. (2016): Plastic mulching in agriculture. Science of the Total Environment",
  "Steinmetz et al. (2020): A simple method for the selective quantification of PE, PP, and PS in soil. J. Anal. Appl. Pyrolysis",
  "Steinmetz et al. (2022): Are agricultural plastic covers a source of plastic debris in soil? SOIL",
  "Heinze et al. (2024): Vertical distribution of microplastics in an agricultural soil. Environmental Pollution"
]

[[projects]]
title = "MIBAS — Microplastic Background Levels in German Soils"
featured = true
period = "2024 – 2026"
question = "What are representative background levels of microplastics in German arable and grassland soils — and which site characteristics and land uses drive their spatial distribution?"
background = "Reliable assessment and future regulation of microplastics in soils require a representative database and harmonized analytics. In the MIBAS project, we systematically quantify microplastics in 600 arable and grassland soils across Germany for the German Environment Agency (UBA)."
role = "Principal investigator: project coordination, quality-assured routine analytics, data evaluation, and reporting."
methods = ["Pyrolysis-GC/MS", "Quality assurance", "Geostatistics", "Reporting for authorities"]
contributions = [
  "Contract analyses and reporting for the derivation of microplastic background levels for Germany.",
  "Quality-assured, reproducible evaluation workflows for large sample numbers."
]
outcomes = "The results provide the empirical basis for assessing and managing microplastic pollution in agricultural soils in Germany."
collaborators = ["German Environment Agency (UBA)", "RPTU Kaiserslautern-Landau"]
funding = "UBA RefoPlan"
publications = [
  "Thomas et al. (2026): Towards regulatory measures for microplastics in soils. Microplastics and Nanoplastics"
]

[[projects]]
title = "Synthetic Hydrophilic Polymers in the Environment"
period = "2022 – present"
question = "Beyond particulate plastics: what is the fate and effect of water-soluble synthetic polymers such as polyacrylates and polyethylene glycols?"
background = "Hydrophilic polymers are an emerging yet overlooked class of anthropogenic substances used in agriculture, personal care, construction, and wastewater treatment. Their ability to interact with water complicates studying their fate and effects in the environment."
role = "Method development, review leadership, supervision of a doctoral project, and grant acquisition."
methods = ["Pyrolysis-GC/MS", "Size-exclusion chromatography", "Soil incubation", "Ecotoxicological endpoints"]
contributions = [
  "Extension of pyrolysis-GC/MS analytics to hydrophilic polymers such as polyacrylic acid, polyquaterniums, polyethylene glycol, and polyvinyl alcohol.",
  "Review papers on superabsorbent polymers in soil and on synthetic hydrophilic polymers across ecosystem boundaries.",
  "Advisory role in the DFG project TransSAPs on the transformation of superabsorbent polymers in soil."
]
outcomes = "The work is opening up analytical access to this substance class and raising its visibility as an environmental risk factor; a Research Training Group proposal (HYRISK) is under review."
collaborators = [
  "RPTU Kaiserslautern-Landau",
  "Leibniz University Hannover"
]
funding = "DFG (TransSAPs, advisory); DFG RTG proposal HYRISK (under review)"
publications = [
  "Buchmann et al. (2024): Superabsorbent polymers in soil: The new microplastics? Cambridge Prisms: Plastics",
  "Steinmetz et al. (2024): Plastic problem solved? TrAC Trends in Analytical Chemistry",
  "Feckler et al. (2026): Liquid polymer enhances methanogenesis in freshwater sediments. Biogeosciences"
]

[[projects]]
title = "Analytical Methods for Complex Environmental Matrices"
period = "2016 – present"
question = "How can environmental assessment rely on methods that are selective, reproducible, and appropriate for complex matrices?"
background = "Soils, sediments, and food matrices challenge routine analytics: matrix effects, heterogeneous samples, and strict quality requirements demand rigorous method validation and transparent workflows, following Eurachem guidance."
role = "Method development and validation, quality assurance, routine analysis, analytical reporting, and coordination of instrument maintenance."
methods = ["(Pyrolysis-)GC/MS", "LC-MS", "HPLC", "FTIR-ATR", "Method validation", "Eurachem QA/QC"]
contributions = [
  "Validation of methods for determining aflatoxins in soil and food matrices by HPLC-FLD and LC-MS.",
  "Routine microplastics analytics with contract analyses and reporting for public authorities.",
  "Development of internal SOPs and transparent workflows for environmental samples."
]
outcomes = "Bridges scientific method development and reliable routine application, including reporting for federal and state authorities."
publications = [
  "Albert et al. (2021): Validation of a method for the determination of aflatoxins in soil and food matrices. ACS Omega",
  "Rung et al. (2023): (Non-)intentionally added substances in post-consumer recyclates. Recycling"
]

[[projects]]
title = "envalysis — R Package for Environmental Data Analysis"
period = "2018 – present"
question = "How can recurring steps of environmental data analysis — calibration, quality criteria, sorption isotherms — become transparent and reproducible?"
background = "Environmental data analysis often involves repeated processing steps, heterogeneous input data, and complex quality-control decisions. Standardized, documented software tools make these processes inspectable and reusable."
role = "Lead developer and maintainer."
methods = ["R", "Statistics", "Chemometrics", "Open source"]
contributions = [
  "Implemented calibration routines following DIN 32645, titration curves, and sorption isotherms.",
  "Continuous maintenance, documentation, and releases on CRAN."
]
outcomes = "An open-source toolbox that facilitates environmental data analyses and chemometrics in R."
links = [
  { label = "CRAN", url = "https://cran.r-project.org/package=envalysis" },
  { label = "GitHub", url = "https://github.com/zsteinmetz/envalysis" }
]

[[projects]]
title = "Open Specy — Open-Source Spectral Analysis"
period = "2020 – present"
question = "How can the identification of microplastics by infrared and Raman spectroscopy become open, reproducible, and community-driven?"
background = "Spectral classification tools for microplastics are often cost-prohibitive and inaccurate for weathered environmental particles. Open Specy provides free processing, identification, and sharing of spectra with a growing community reference library."
role = "Co-developer of the R package and the web application."
methods = ["R", "Shiny", "FTIR", "Raman", "Machine learning", "Open science"]
contributions = [
  "Co-development of the Open Specy R package and web tool for processing and identifying microplastic spectra.",
  "Contributions to the 2025 release (Open Specy 1.0) with automated (hyper)spectral processing and machine-learning classifiers."
]
outcomes = "Open Specy is a widely used open-source tool in microplastics research with more than 40,000 open-source reference spectra."
links = [
  { label = "Website", url = "https://openspecy.org" },
  { label = "GitHub", url = "https://github.com/wincowgerDEV/OpenSpecy-package" }
]
publications = [
  "Cowger et al. (2021): Microplastic spectral classification needs an open source community. Analytical Chemistry",
  "Cowger et al. (2025): Open Specy 1.0: Automated (hyper)spectroscopy for microplastics. Analytical Chemistry"
]

[[projects]]
title = "Reproducible Environmental Data Workflows"
period = "2019 – present"
question = "How can environmental data analysis become more transparent, reproducible, and efficient?"
background = "Analytical laboratories generate growing volumes of heterogeneous data. Version control, documented processing steps, automated analyses, and transparent reporting make analytical workflows easier to inspect, reuse, and maintain."
role = "Developer and implementer of the group's data workflows."
methods = ["R", "Python", "Automation", "Git", "Docker"]
contributions = [
  "Parallelizable R workflows for evaluating pyrolysis-GC/MS data, including human-in-the-loop quality-control steps — substantially reducing processing time.",
  "AI-supported, transparent workflows for categorizing free-text survey responses."
]
outcomes = "Faster, transparent, and auditable data pipelines for research and contract analyses."

