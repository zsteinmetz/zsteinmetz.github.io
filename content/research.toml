# ------------------------------------------------------------------
# Projects
# ------------------------------------------------------------------
[[projects]]
title = "AgriRePlas — Reducing the Plastic Footprint in Agriculture"
featured = true
period = "2025 – 2029"
question = "How is plastic used, reused, and recycled in agriculture in the Upper Rhine region — and how can its plastic footprint be reduced without compromising productivity?"
background = "Plastic materials such as mulch films, tunnels, and tree guards are indispensable in modern fruit and vegetable cultivation, yet their growing environmental impact — especially through microplastics — raises concerns for soil health. AgriRePlas, a cross-border EU Interreg project with 19 partners from Alsace, Baden, the Southern Palatinate, and northern Switzerland, assesses the status quo of plastic use, evaluates the plastic footprint, and develops targeted solutions: reusable systems, improved recycling strategies, and safe biodegradable alternatives."
role = "Work-package lead, RPTU."
methods = ["Pyrolysis-GC/MS", "FTIR-ATR", "Quality assurance", "Survey research", "AI-assisted classification", "R"]
contributions = [
  "Developing a new pyrolysis-GC/MS method to identify and quantify biodegradable plastics in agricultural soils.",
  "Screening field plastic losses by pyrolysis-GC/MS and FTIR-ATR.",
  "Designing and implementing a trilingual questionnaire on the use, reuse, and recycling of plastics in agricultural practice.",
  "Evaluating 250 completed questionnaires from farms in five countries with transparent, reproducible R workflows, including AI-assisted free-text classification with expert validation."
]
outcomes = "Designed to inform the development of reusable systems, improved recycling strategies, and safe biodegradable alternatives in the Upper Rhine region — a model for reducing the plastic footprint of agriculture beyond the region."
collaborators = ["HYDRA Marine Sciences", "DLR Rhineland-Palatinate", "Chambre d'Agriculture Alsace", "FiBL", "Empa"]
funding = "EU Interreg Upper Rhine"
links = [
  { label = "Project page", url = "https://www.hydramarinesciences.com/agrireplas-english" }
]

[[projects]]
title = "MIBAS — Microplastic Background Levels in German Soils"
featured = true
period = "2024 – 2027"
question = "What are representative background levels of microplastics in German arable and grassland soils — and which site characteristics and land uses drive their spatial distribution?"
background = "Reliable assessment and future regulation of microplastics in soils require a representative database and harmonized analytics. In the MIBAS project, we systematically quantify microplastics in 600 arable and grassland soils across Germany for the German Environment Agency (UBA)."
role = "Principal investigator."
methods = ["Pyrolysis-GC/MS", "Quality assurance", "Geostatistics", "Reporting for authorities"]
contributions = [
  "Contract analyses and reporting for the derivation of microplastic background levels for Germany.",
  "Quality-assured, reproducible evaluation workflows for large sample numbers."
]
outcomes = "The results provide the empirical basis for assessing and managing microplastic pollution in agricultural soils in Germany."
collaborators = ["German Environment Agency (UBA)", "RPTU University Kaiserslautern-Landau"]
funding = "UBA RefoPlan"
publications = [
  "Thomas et al. (2026): Towards regulatory measures for microplastics in soils. Microplastics and Nanoplastics"
]

[[projects]]
title = "Synthetic Hydrophilic Polymers in the Environment"
period = "2022 – present"
question = "Beyond particulate plastics: what is the fate and effect of water-soluble synthetic polymers such as polyacrylates and polyethylene glycols?"
background = "Hydrophilic polymers are an emerging yet overlooked class of anthropogenic substances used in agriculture, personal care, construction, and wastewater treatment. Their ability to interact with water complicates the study of their fate and effects in the environment."
role = "Scientific advisor and doctoral co-supervisor."
methods = ["Pyrolysis-GC/MS", "Size-exclusion chromatography", "Soil incubation", "Ecotoxicological endpoints"]
contributions = [
  "Extension of pyrolysis-GC/MS analytics to hydrophilic polymers such as polyacrylic acid, polyquaterniums, polyethylene glycol, and polyvinyl alcohol.",
  "Theoretical concepts on superabsorbent polymers in soil and on synthetic hydrophilic polymers across ecosystem boundaries.",
  "Advisory role in the DFG project TransSAPs on the transformation of superabsorbent polymers in soil."
]
outcomes = "This work develops the analytical basis for studying hydrophilic synthetic polymers and evaluating their environmental relevance."
collaborators = [
  "RPTU University Kaiserslautern-Landau",
  "Leibniz University Hannover"
]
funding = "DFG (TransSAPs, advisory)"
publications = [
  "Buchmann et al. (2024): Superabsorbent polymers in soil: The new microplastics? Cambridge Prisms: Plastics",
  "Steinmetz et al. (2024): Plastic problem solved? TrAC Trends in Analytical Chemistry",
  "Feckler et al. (2026): Liquid polymer enhances methanogenesis in freshwater sediments. Biogeosciences"
]

[[projects]]
title = "envalysis — R Package for Environmental Data Analysis"
period = "2018 – present"
question = "How can recurring steps of environmental data analysis become transparent and reproducible?"
background = "Environmental data analysis often involves repeated processing steps, heterogeneous input data, and complex quality-control decisions. Standardized, documented software tools make these processes inspectable and reusable."
role = "Lead developer and maintainer."
methods = ["R", "Statistics", "Chemometrics", "Open source"]
contributions = [
  "Implemented calibration routines following DIN 32645 and sorption isotherms.",
  "Maintenance, documentation, and releases on CRAN."
]
outcomes = "An open-source toolbox that facilitates environmental data analyses and chemometrics in R."
links = [
  { label = "CRAN", url = "https://cran.r-project.org/package=envalysis" },
  { label = "GitHub", url = "https://github.com/zsteinmetz/envalysis" }
]

[[projects]]
title = "Open Specy — Open-Source Spectral Analysis"
period = "2020 – present"
question = "How can the identification of microplastics by infrared and Raman spectroscopy become open, reproducible, and community-driven?"
background = "Spectral classification tools for microplastics are often cost-prohibitive and inaccurate for weathered environmental particles. Open Specy provides free processing, identification, and sharing of spectra with a growing community reference library."
role = "Co-developer."
methods = ["R", "Shiny", "FTIR", "Raman", "Machine learning", "Open science"]
contributions = [
  "Co-development of the Open Specy R package and web tool for processing and identifying microplastic spectra.",
  "Contributions to the 2025 release (Open Specy 1.0) with automated (hyper)spectral processing and machine-learning classifiers."
]
outcomes = "Open Specy is an open-source platform for processing, identifying, and sharing infrared and Raman spectra, supported by a community reference library of more than 40,000 spectra."
links = [
  { label = "Website", url = "https://openspecy.org" },
  { label = "GitHub", url = "https://github.com/wincowgerDEV/OpenSpecy-package" }
]
publications = [
  "Cowger et al. (2021): Microplastic spectral classification needs an open source community. Analytical Chemistry",
  "Cowger et al. (2025): Open Specy 1.0: Automated (hyper)spectroscopy for microplastics. Analytical Chemistry"
]

