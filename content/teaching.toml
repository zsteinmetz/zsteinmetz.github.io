[[sections.items]]
title = "Research-informed learning"
content = "Current environmental questions and scientific literature connect core concepts with ongoing research. Journal-club discussions help students evaluate evidence, methods, and uncertainty."

[[sections.items]]
title = "Measurement, data, and interpretation"
content = "Students link laboratory observations and analytical measurements with statistics and environmental interpretation. Rather than treating instruments as black boxes, they learn how data are generated, assessed, and communicated."

[[sections.items]]
title = "Independent and critical scientific practice"
content = "Flipped-classroom formats, research-based assignments, and guided discussion support self-directed learning, critical reflection, and collaborative problem-solving."

