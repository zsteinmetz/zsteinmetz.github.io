# ------------------------------------------------------------------
# Academic profile
# ------------------------------------------------------------------
[profile]
narrative = """I am a doctoral researcher in the Department of Natural Science at the University of Example, where I work on the mathematical principles of natural philosophy — in particular, structure-preserving numerical methods for the time-dependent Schrödinger equation.

My academic path began with a BSc in Natural Science at the University of Example (2021–2025, First Class Honours). An undergraduate project on the stability of high-order integrators first drew me to numerical analysis; it later grew into my first peer-reviewed article. Alongside my studies I worked as a research assistant on Monte Carlo methods for lattice models and completed a software engineering internship in scientific computing, which shaped my conviction that rigorous mathematics and reliable software belong together.

My doctoral research combines rigorous stability analysis with high-performance simulation. The long-term goal of my work is to make quantum dynamics simulations trustworthy over long time horizons, and to contribute open-source tools that make such simulations accessible to other researchers."""

interests = [
  "Structure-preserving integrators",
  "Quantum dynamics",
  "Numerical stability analysis",
  "Monte Carlo methods",
  "Scientific software engineering"
]

