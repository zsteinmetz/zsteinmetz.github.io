# ------------------------------------------------------------------
# Research contributions and projects
# ------------------------------------------------------------------
[[projects]]
title = "Structure-Preserving Integrators for Quantum Dynamics"
period = "2024 – Present"
featured = true
question = "How can we integrate the time-dependent Schrödinger equation over long time horizons without accumulating phase error or losing unitarity?"
background = "Standard explicit integrators accumulate phase error quickly in quantum dynamics simulations, making long-time simulations unreliable. Implicit symplectic methods preserve unitarity but are costly, and little was known about where the practical stability boundaries lie for high-order schemes."
role = "Principal investigator of the doctoral subproject: problem formulation, analysis, implementation and writing."
methods = [
  "Spectral analysis of Hamiltonian operators",
  "Derivation of stability boundaries for Runge–Kutta schemes",
  "Optimization of integrator coefficients",
  "Wave-packet scattering and harmonic-oscillator benchmarks"
]
contributions = [
  "Derived rigorous stability boundaries for high-order Runge–Kutta integrators applied to the time-dependent Schrödinger equation.",
  "Established a relationship between the CFL condition and the imaginary eigenvalues characteristic of quantum propagators.",
  "Proposed optimized RK coefficients that significantly reduce phase error accumulation compared to standard integrators."
]
outcomes = "The analysis was published as a first-author article in the Journal of Computational Physics (2024), and the optimized coefficients are being adopted in the benchmark suite used by collaborating groups."
collaborators = ["Sarah O'Connor (corresponding author)", "Prof. Advisor One"]
funding = "Example Research Council Doctoral Studentship (2025–2028); faculty computing cluster time."
publications = [
  "Numerical Stability Analysis of High-Order Runge–Kutta Methods in Quantum Dynamics — Journal of Computational Physics, 2024"
]

[[projects.links]]
label = "Journal article (DOI)"
url = "https://doi.org/10.1016/j.jcp.2023.110832"

[[projects]]
title = "Phase Transitions on Hyperbolic Lattices"
period = "2023 – 2024"
featured = true
question = "How do critical phenomena change when the Ising model is placed on exponentially expanding, non-Euclidean lattices?"
background = "Phase transitions on hyperbolic lattices are relevant to quantum gravity models and holographic duality, but reliable simulation data was scarce because standard finite-size scaling tools do not directly apply."
role = "Research assistant: implementation, simulation campaign and data analysis, under the supervision of the project lead."
methods = [
  "Monte Carlo sampling (cluster algorithms)",
  "Finite-size scaling adapted to hyperbolic geometry",
  "High-throughput parameter sweeps on an HPC cluster"
]
contributions = [
  "Implemented a Monte Carlo pipeline for Ising models on non-Euclidean lattices.",
  "Observed a suppression of the correlation length divergence, indicating mean-field-like behaviour induced by the exponential expansion of lattice volume."
]
outcomes = "Findings published at the 2023 International Conference on Computational Physics, with implications for quantum gravity models and holographic duality."
collaborators = ["Charlie Brown", "Prof. Advisor One"]
funding = "Faculty undergraduate research assistantship."
publications = [
  "Monte Carlo Simulations of Phase Transitions in 2D Ising Models on Non-Euclidean Lattices — ICCP 2023"
]

