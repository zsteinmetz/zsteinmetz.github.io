# ------------------------------------------------------------------
# Introduction
# ------------------------------------------------------------------
[profile]
narrative = """I combine environmental chemistry, soil science, ecotoxicology, and analytical chemistry to study pollutants from their sources to their environmental fate and effects. My research focuses particularly on plastics and other synthetic polymers in terrestrial systems, including agricultural soils.

My work links laboratory-based environmental analysis with method development, quality assurance, statistical evaluation, and reproducible data workflows. I lead research and analytical projects, teach and supervise students, and collaborate with public-sector and applied research partners on environmental monitoring, measurement, and data-interpretation challenges."""

interests = [
  "Environmental chemistry",
  "Soil science",
  "Ecotoxicology",
  "Analytical chemistry",
  "Reproducible data analysis"
]

