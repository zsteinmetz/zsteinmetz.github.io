grants_overview = """My research is funded through competitive grants and contract research from national agencies and institutional funds, from commissioned environmental monitoring and reporting for the German Environment Agency (UBA) to practice-oriented collaborative projects on the use, reuse, and recycling of plastics in agriculture funded by EU Interreg Upper Rhine. [Explore my current research ...](/research)"""

