# ------------------------------------------------------------------
# Introduction
# ------------------------------------------------------------------
[profile]
narrative = """My work combines environmental chemistry, soil science, ecotoxicology, and analytical chemistry to investigate pollutants from source to sink—from release and transport to transformation, exposure, and effects on ecosystem functions. A particular focus is on plastics and other synthetic polymers in terrestrial environments.

I combine laboratory-based environmental analysis with robust quality assurance, statistical evaluation, and reproducible computational workflows. Alongside research, I lead projects and teams, teach and supervise students, and work with public-sector and applied research partners on environmental monitoring and analytical challenges."""

interests = [
  "Environmental chemistry",
  "Soil science",
  "Ecotoxicology",
  "Analytical chemistry",
  "Reproducible data analysis"
]

