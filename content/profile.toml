# ------------------------------------------------------------------
# Introduction
# ------------------------------------------------------------------
[profile]
narrative = """I combine laboratory-based analysis with statistical evaluation, reproducible computational workflows, and scientific communication. Trained as an ecotoxicologist, I look at pollutants from source to sink — from their release and transport to their transformation and indirect effects on ecosystem functions.

In addition to research, I have experience in project management, team leadership, teaching, supervision, and collaboration with public-sector and applied research partners. As head of the "Soil Stressors" team at RPTU Kaiserslautern-Landau, I coordinate analytical services for federal and state authorities alongside third-party-funded research projects."""

interests = [
  "Environmental chemistry",
  "Soil science",
  "Ecotoxicology",
  "Analytical chemistry",
  "Reproducible data analysis"
]

