[[sections.items]]
title = "Forschungsbasiertes Lernen"
content = "Aktuelle Umweltfragen und wissenschaftliche Literatur verknüpfen zentrale Konzepte mit laufender Forschung. In Journal-Club-Diskussionen lernen Studierende, Forschungsergebnisse, Methoden und Unsicherheiten kritisch zu bewerten."

[[sections.items]]
title = "Messung, Daten und Interpretation"
content = "Studierende verknüpfen Laborbeobachtungen und analytische Messungen mit Statistik und umweltwissenschaftlicher Interpretation. Statt Messgeräte als Blackbox zu behandeln, lernen sie, wie Daten entstehen, bewertet und kommuniziert werden."

[[sections.items]]
title = "Selbstständiges und kritisches wissenschaftliches Arbeiten"
content = "Inverted-Classroom-Formate, forschungsnahe Aufgabenstellungen und angeleitete Diskussionen fördern selbstgesteuertes Lernen, kritische Reflexion und kollaboratives Problemlösen."

