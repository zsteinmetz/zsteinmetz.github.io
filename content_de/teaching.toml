type = "sections"
title = "Lehre"
description = "Ich unterstütze Studierende, Umweltprozesse mit Untersuchungsmethoden zu verknüpfen: von der Probenahme und Laboranalyse bis hin zu Statistik, kritischer Bewertung und wissenschaftlicher Kommunikation. Meine Lehre verbindet forschungsbasiertes Lernen, praktische Laborarbeit sowie selbstständiges und kritisches Denken."

