# ------------------------------------------------------------------
# Introduction
# ------------------------------------------------------------------
[profile]
narrative = """Ich verbinde Umweltchemie, Bodenkunde, Ökotoxikologie und analytische Chemie, um Schadstoffe von ihren Quellen über ihren Verbleib bis zu ihren Auswirkungen zu untersuchen. Ein Schwerpunkt meiner Forschung liegt auf Kunststoffen und anderen synthetischen Polymeren in terrestrischen Systemen, insbesondere in landwirtschaftlich genutzten Böden.

Meine Arbeit verknüpft laborbasierte Umweltanalytik mit Methodenentwicklung, Qualitätssicherung, statistischer Auswertung und reproduzierbarer Datenverarbeitung. Ich leite Forschungs- und Analytikprojekte, lehre und betreue Studierende und arbeite mit Partnern aus Behörden und der anwendungsorientierten Forschung an Fragen des Umweltmonitorings, der Messtechnik und der Dateninterpretation zusammen."""

interests = [
  "Umweltchemie",
  "Bodenkunde",
  "Ökotoxikologie",
  "Analytische Chemie",
  "Reproduzierbare Datenanalyse"
]

