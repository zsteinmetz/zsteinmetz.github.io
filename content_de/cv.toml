type = "cv"
title = "Profil"
description = "Umweltwissenschaftler mit Schwerpunkt auf Verbleib und Auswirkung anthropogener Schadstoffe in Böden und Agrarökosystemen."

# Overview keys are root-level: they MUST stay above the first table header
# ([headings]) — in TOML, a bare key after an [[array]] or [table] header
# belongs to that last table instead of the document root.
teaching_overview = """Ich lehre Umweltwissenschaften als evidenzbasierte und praxisorientierte Disziplin. Meine Lehrveranstaltungen verbinden konzeptionelles Verständnis mit Laborarbeit, kritischem Lesen, Datenanalyse und transparenter wissenschaftlicher Kommunikation. Aktivierende und forschungsbasierte Lehrformate helfen, fachliches Wissen und ein eigenständiges wissenschaftliches Urteilsvermögen zu entwickeln. [Mehr über meine Lehre, Lehrveranstaltungen und Betreuung erfahren ...](/teaching)"""

grants_overview = """Meine Forschung finanziert sich über kompetitive Fördermittel und Auftragsforschung: von nationalen Fördergebern und institutionellen Mitteln über beauftragtes Umweltmonitoring und Berichterstattung für das Umweltbundesamt (UBA) bis hin zu praxisorientierten Verbundprojekten zum Einsatz, zur Wiederverwendung und zum Recycling von Kunststoffen in der Landwirtschaft, gefördert durch EU Interreg Oberrhein. [Mehr über meine aktuelle Forschung erfahren ...](/research)"""

service_overview = """Ich bringe mich als Vertreter des wissenschaftlichen Mittelbaus in die Gremienarbeit des Fachbereichs ein und bin als Gutachter für Förderorganisationen (DFG, FNR) und wissenschaftliche Fachzeitschriften tätig."""

