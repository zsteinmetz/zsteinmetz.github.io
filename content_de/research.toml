type = "cv"
title = "Forschung"
description = "Meine Arbeit verbindet umweltwissenschaftliche Fragestellungen mit qualitätsgesicherter, quantitativer Analyse und praxisnaher Interpretation. Mein Ziel ist es, analytische und rechnergestützte Ansätze zu entwickeln, die die Datengrundlage in den Umweltwissenschaften zuverlässiger, transparenter und anwendbarer machen."

# Root-level overview key shown above the project cards (must stay above the
# first table header, like teaching_overview in cv.toml).
research_overview = """Meine Forschung befasst sich mit anthropogenen Schadstoffen in Böden und Agrarökosystemen — von Kunststoffen und anderen synthetischen Polymeren bis hin zu landwirtschaftlichen Einträgen. Dabei verbinde ich Umweltanalytik mit Bodenkunde und Ökotoxikologie, um zu verstehen, wie diese Schadstoffe in terrestrische Umgebungen gelangen, sich darin bewegen und umwandeln und was das für Ökosystemfunktionen bedeutet. Die folgenden Projekte decken dieses Spektrum ab: Methodenentwicklung und Qualitätssicherung für die Messung synthetischer Polymere im Boden, Monitoring von Hintergrundwerten in Agrarsystemen, praxisorientierte Forschung zu Einsatz, Wiederverwendung und Recycling von Kunststoffen in der Landwirtschaft sowie Open-Source-Werkzeuge für die spektrale Klassifikation und reproduzierbare Datenanalyse."""

[headings]
profile = "Profil"
highlights = "Forschungsschwerpunkte"
research = "Projekte"
publications = "Publikationen"

# ------------------------------------------------------------------
# Research profile
# ------------------------------------------------------------------
[profile]
narrative = """Ich habe einen Hintergrund in Umweltchemie, Ökotoxikologie und Bodenkunde und untersuche Schadstoffe von der Quelle bis zur Senke: Wie gelangen sie in landwirtschaftliche Systeme, wie werden sie transportiert, wie wandeln sich zwischen Land und Wasser um und wie beeinflusst dies Ökosystemfunktionen? Um diese Fragen zu beantworten, sind verlässliche Daten unerlässlich. Deshalb begleiten Methodenentwicklung, Validierung, Qualitätssicherung und reproduzierbare Datenworkflows alle Schritte meines Forschungsprozesses."""

